name: TASK-02D VERIFY-02 — CI Packaging Verification

on:
  push:
    branches:
      - android-jvm
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TASK-02D packaging verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Verify Mindustry source state
        shell: bash
        run: |
          set -euo pipefail

          echo "Mindustry branch: $(git branch --show-current)"
          echo "Mindustry HEAD: $(git rev-parse HEAD)"
          echo "Expected Android JVM branch: android-jvm"
          echo "Event: ${{ github.event_name }}"
          echo "Head branch: ${{ github.head_ref }}"

          test "${GITHUB_HEAD_REF:-$(git branch --show-current)}" = "android-jvm"

          ARC_REF="$(awk -F= '$1 == "archash" {print $2; exit}' gradle.properties | tr -d '[:space:]')"
          test "$ARC_REF" = "8eb00ffff0126d0576c67df46f99b8f6bccd96fe"

          test "$(grep -Fc 'configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }' desktop/build.gradle)" -eq 1
          ! grep -Fq 'exclude("arc/util/SharedLibraryLoader.class")' desktop/build.gradle
          ! grep -Fq 'from("../Arc/arc-core/build/classes/java/main")' desktop/build.gradle

          echo "desktop/build.gradle: normal runtimeClasspath packaging path confirmed"
          echo "SharedLibraryLoader exclusion/injection workaround: absent"

      - name: Clone and pin Arc
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_ARC_SHA="8eb00ffff0126d0576c67df46f99b8f6bccd96fe"

          git clone --no-checkout --filter=blob:none --depth=1 https://github.com/Anuken/Arc ../Arc
          git -C ../Arc fetch --no-tags --depth=1 origin "$EXPECTED_ARC_SHA"
          git -C ../Arc checkout --detach "$EXPECTED_ARC_SHA"

          ACTUAL_ARC_SHA="$(git -C ../Arc rev-parse HEAD)"
          echo "Arc HEAD: $ACTUAL_ARC_SHA"
          test "$ACTUAL_ARC_SHA" = "$EXPECTED_ARC_SHA"

      - name: Apply deterministic Arc SharedLibraryLoader patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_FILE="ci/android-jvm/task02d-arc-shared-library-loader.patch"
          test -f "$PATCH_FILE"
          git -C ../Arc apply --check "$GITHUB_WORKSPACE/$PATCH_FILE"
          git -C ../Arc apply "$GITHUB_WORKSPACE/$PATCH_FILE"
          git -C ../Arc diff --check
          git -C ../Arc diff --name-only | grep -Fxq 'arc-core/src/arc/util/SharedLibraryLoader.java'

          ACTUAL_ARC_SHA="$(git -C ../Arc rev-parse HEAD)"
          test "$ACTUAL_ARC_SHA" = "8eb00ffff0126d0576c67df46f99b8f6bccd96fe"

      - name: Build and inspect patched Arc class output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts/task02d-verify02

          ./gradlew :Arc:arc-core:classes --rerun-tasks --stacktrace --console=plain

          LOADER="../Arc/arc-core/build/classes/java/main/arc/util/SharedLibraryLoader.class"
          test -f "$LOADER"

          stat -c 'size=%s path=%n' "$LOADER" | tee ci-artifacts/task02d-verify02/arc-loader-class.txt

          javap -classpath "../Arc/arc-core/build/classes/java/main" -c -p arc.util.SharedLibraryLoader |
            tee ci-artifacts/task02d-verify02/arc-loader-javap.txt >/dev/null

          grep -Fq 'isAndroidRuntime' ci-artifacts/task02d-verify02/arc-loader-javap.txt
          grep -Fq 'androidResourcePath' ci-artifacts/task02d-verify02/arc-loader-javap.txt
          grep -Fq 'System.load' ci-artifacts/task02d-verify02/arc-loader-javap.txt

      - name: Build and inspect Arc core JAR
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :Arc:arc-core:jar --rerun-tasks --stacktrace --console=plain

          mapfile -t ARC_JARS < <(
            find ../Arc/arc-core/build/libs -maxdepth 1 -type f -name 'arc-core*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' |
              sort
          )

          echo "Generated Arc core JARs:"
          printf '%s\n' "${ARC_JARS[@]}"

          test "${#ARC_JARS[@]}" -ge 1

          ARC_JAR="${ARC_JARS[0]}"
          echo "ARC_CORE_JAR=$ARC_JAR" | tee ci-artifacts/task02d-verify02/arc-core-jar.txt

          jar tf "$ARC_JAR" | tee ci-artifacts/task02d-verify02/arc-core-jar-contents.txt
          grep -Fxq 'arc/util/SharedLibraryLoader.class' ci-artifacts/task02d-verify02/arc-core-jar-contents.txt

      - name: Inspect Android-JVM runtimeClasspath resolution
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts/task02d-verify02

          ./gradlew -PandroidJvm :desktop:dependencies --configuration runtimeClasspath --console=plain |
            tee ci-artifacts/task02d-verify02/runtimeClasspath-dependencies.txt

          grep -Fq 'com.github.Anuken:arc-core:8eb00ffff0 -> project :Arc:arc-core' \
            ci-artifacts/task02d-verify02/runtimeClasspath-dependencies.txt

          ./gradlew -PandroidJvm :desktop:dependencyInsight \
            --configuration runtimeClasspath \
            --dependency com.github.Anuken:arc-core \
            --console=plain |
            tee ci-artifacts/task02d-verify02/arc-core-dependency-insight.txt

          cat > ci-artifacts/task02d-verify02/runtimeClasspath.init.gradle <<'EOF'
allprojects {
    afterEvaluate { p ->
        if (p.path == ':desktop') {
            p.tasks.register('task02dVerifyRuntimeClasspath') {
                doLast {
                    println '== TASK-02D VERIFY-02: resolved runtimeClasspath files =='
                    p.configurations.runtimeClasspath.resolve().sort { a, b -> a.absolutePath <=> b.absolutePath }.each {
                        println "RUNTIME_FILE=${it.absolutePath}"
                    }
                }
            }
        }
    }
}
EOF

          ./gradlew -PandroidJvm \
            --init-script ci-artifacts/task02d-verify02/runtimeClasspath.init.gradle \
            :desktop:task02dVerifyRuntimeClasspath \
            --console=plain |
            tee ci-artifacts/task02d-verify02/runtimeClasspath-files.txt

          grep -Fq 'RUNTIME_FILE=' ci-artifacts/task02d-verify02/runtimeClasspath-files.txt

          ARC_RUNTIME_FILE="$(grep 'RUNTIME_FILE=' ci-artifacts/task02d-verify02/runtimeClasspath-files.txt |
            grep '/Arc/arc-core/build/libs/' | head -n1 | sed 's/^RUNTIME_FILE=//')"

          test -n "$ARC_RUNTIME_FILE"
          test -f "$ARC_RUNTIME_FILE"

          echo "Resolved Arc runtime artifact: $ARC_RUNTIME_FILE"
          jar tf "$ARC_RUNTIME_FILE" | grep -Fxq 'arc/util/SharedLibraryLoader.class'

      - name: Build Android-JVM Mindustry JAR
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew -PandroidJvm desktop:dist --rerun-tasks --stacktrace --console=plain

          JAR="desktop/build/libs/Mindustry.jar"
          test -f "$JAR"

          mkdir -p ci-artifacts/task02d-verify02
          cp "$JAR" ci-artifacts/task02d-verify02/Mindustry-android-jvm.jar
          sha256sum "$JAR" | tee ci-artifacts/task02d-verify02/Mindustry-android-jvm.jar.sha256

      - name: Inspect final Android-JVM JAR and patched loader
        shell: bash
        run: |
          set -euo pipefail

          JAR="desktop/build/libs/Mindustry.jar"

          jar tf "$JAR" | tee ci-artifacts/task02d-verify02/Mindustry-jar-contents.txt

          grep -Fxq 'arc/util/SharedLibraryLoader.class' ci-artifacts/task02d-verify02/Mindustry-jar-contents.txt
          grep -Fxq 'arm64-v8a/libarc.so' ci-artifacts/task02d-verify02/Mindustry-jar-contents.txt

          javap -classpath "$JAR" -c -p arc.util.SharedLibraryLoader |
            tee ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt >/dev/null

          grep -Fq 'isAndroidRuntime' ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt
          grep -Fq 'androidResourcePath' ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt
          grep -Fq 'System.load' ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt

      - name: Verify packaged Android ARM64 Arc native artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts/task02d-verify02
          unzip -p desktop/build/libs/Mindustry.jar arm64-v8a/libarc.so > ci-artifacts/task02d-verify02/libarc.so
          test -s ci-artifacts/task02d-verify02/libarc.so

          command -v llvm-readelf >/dev/null 2>&1 || true
          READELF="${ANDROID_NDK_HOME:-}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ ! -x "$READELF" ]; then
            READELF="$(command -v llvm-readelf || command -v readelf || true)"
          fi
          test -n "$READELF"

          "$READELF" -h ci-artifacts/task02d-verify02/libarc.so |
            tee ci-artifacts/task02d-verify02/libarc-readelf-header.txt

          "$READELF" -d ci-artifacts/task02d-verify02/libarc.so |
            tee ci-artifacts/task02d-verify02/libarc-readelf-dynamic.txt

          CLASS="$($READELF -h ci-artifacts/task02d-verify02/libarc.so | awk -F: '/Class:/{gsub(/^ +/,"",$2); print $2}')"
          MACHINE="$($READELF -h ci-artifacts/task02d-verify02/libarc.so | awk -F: '/Machine:/{gsub(/^ +/,"",$2); print $2}')"

          test "$CLASS" = "ELF64"
          printf '%s' "$MACHINE" | grep -q 'AArch64'

          echo "ELF class: $CLASS"
          echo "ELF machine: $MACHINE"

          "$READELF" -d ci-artifacts/task02d-verify02/libarc.so |
            sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p' | head -n1 |
            tee ci-artifacts/task02d-verify02/soname.txt

          "$READELF" -d ci-artifacts/task02d-verify02/libarc.so |
            sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' |
            tee ci-artifacts/task02d-verify02/dt-needed.txt

          for forbidden in libpthread.so.0 libdl.so.2 libm.so.6 libc.so.6 libstdc++.so.6 libgcc_s.so.1 ld-linux-aarch64.so.1 libGL.so.1 libSDL2-2.0.so.0; do
            if grep -Fxq "$forbidden" ci-artifacts/task02d-verify02/dt-needed.txt; then
              echo "::error::Forbidden dependency present: $forbidden"
              exit 1
            fi
          done

      - name: Run established Android-JVM Arc packaging verifier
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail

          bash scripts/android-jvm/task-02c-verify-packaging.sh \
            ci-artifacts/task02d-verify02/Mindustry-android-jvm.jar

      - name: Desktop regression build
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew desktop:dist --rerun-tasks --stacktrace --console=plain
          test -f desktop/build/libs/Mindustry.jar
          echo "desktop:dist PASS; desktop/build/libs/Mindustry.jar exists"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TASK-02D-VERIFY-02-packaging-${{ github.sha }}
          path: ci-artifacts/task02d-verify02
          if-no-files-found: error

# TASK-02D VERIFY-02 trigger commit: workflow must execute from a subsequent push.
