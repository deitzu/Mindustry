name: Tests

on: [push, workflow_dispatch]

permissions: {}
jobs:
  runPush:
    permissions:
      contents: write # for Update bundles

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Trigger BE build
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        git clone --depth=1 --branch=master https://github.com/Anuken/MindustryBuilds ../MindustryBuilds
        cd ../MindustryBuilds
        BNUM=$(($GITHUB_RUN_NUMBER + 20000))
        git tag ${BNUM}
        git config --global user.name "Github Actions"
        git push https://Anuken:${{ secrets.API_TOKEN_GITHUB }}@github.com/Anuken/MindustryBuilds ${BNUM}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Update bundles
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        ./gradlew -DcompileMethodParams updateBundles

        if [ -n "$(git status --porcelain)" ]; then
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add core/assets/bundles/*
          git commit -m "Automatic bundle update"
          git push
        fi
    - name: Update scripts, class mappings and map names
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        ./gradlew -DcompileMethodParams updateScripts fixMaps

        if [ -n "$(git status --porcelain)" ]; then
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add core/assets/scripts/* core/src/mindustry/mod/ClassMap.java
          git add core/assets/maps/*
          git commit -m "Automatic class mapping and map name update"
          git push
        fi

    - name: Run unit tests
      run: ./gradlew tests:test --rerun --stacktrace

task02d-verify:
    name: TASK-02D VERIFY-02 packaging verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout exact pushed commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: wrapper

    - name: Verify source and Arc pin
      shell: bash
      run: |
        set -euo pipefail
        echo "Mindustry ref: $GITHUB_REF_NAME"
        echo "Mindustry HEAD: $(git rev-parse HEAD)"
        test "$GITHUB_REF_NAME" = "android-jvm"

        ARC_REF="$(awk -F= '$1 == "archash" {print $2; exit}' gradle.properties | tr -d '[:space:]')"
        test "$ARC_REF" = "8eb00ffff0126d0576c67df46f99b8f6bccd96fe"

        grep -Fq 'configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }' desktop/build.gradle
        ! grep -Fq 'exclude("arc/util/SharedLibraryLoader.class")' desktop/build.gradle
        ! grep -Fq 'from("../Arc/arc-core/build/classes/java/main")' desktop/build.gradle

    - name: Clone and pin Arc
      shell: bash
      run: |
        set -euo pipefail
        EXPECTED_ARC_SHA="8eb00ffff0126d0576c67df46f99b8f6bccd96fe"
        git clone --no-checkout --filter=blob:none --depth=1 https://github.com/Anuken/Arc ../Arc
        git -C ../Arc fetch --no-tags --depth=1 origin "$EXPECTED_ARC_SHA"
        git -C ../Arc checkout --detach "$EXPECTED_ARC_SHA"
        test "$(git -C ../Arc rev-parse HEAD)" = "$EXPECTED_ARC_SHA"

    - name: Apply patched SharedLibraryLoader
      shell: bash
      run: |
        set -euo pipefail
        PATCH_FILE="$GITHUB_WORKSPACE/ci/android-jvm/task02d-arc-shared-library-loader.patch"
        git -C ../Arc apply --check "$PATCH_FILE"
        git -C ../Arc apply "$PATCH_FILE"
        git -C ../Arc diff --check
        test "$(git -C ../Arc rev-parse HEAD)" = "8eb00ffff0126d0576c67df46f99b8f6bccd96fe"

    - name: Build and inspect Arc class output
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ci-artifacts/task02d-verify02
        ./gradlew :Arc:arc-core:classes --rerun-tasks --stacktrace --console=plain
        LOADER="../Arc/arc-core/build/classes/java/main/arc/util/SharedLibraryLoader.class"
        test -f "$LOADER"
        javap -classpath "../Arc/arc-core/build/classes/java/main" -c -p arc.util.SharedLibraryLoader |
          tee ci-artifacts/task02d-verify02/arc-loader-javap.txt >/dev/null
        grep -Fq 'isAndroidRuntime' ci-artifacts/task02d-verify02/arc-loader-javap.txt
        grep -Fq 'androidResourcePath' ci-artifacts/task02d-verify02/arc-loader-javap.txt
        grep -Fq 'System.load' ci-artifacts/task02d-verify02/arc-loader-javap.txt

    - name: Build and inspect Arc core JAR
      shell: bash
      run: |
        set -euo pipefail
        ./gradlew :Arc:arc-core:jar --rerun-tasks --stacktrace --console=plain
        mapfile -t ARC_JARS < <(
          find ../Arc/arc-core/build/libs -maxdepth 1 -type f -name 'arc-core*.jar'             ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort
        )
        test "${#ARC_JARS[@]}" -ge 1
        ARC_JAR="${ARC_JARS[0]}"
        echo "Actual Arc core JAR: $ARC_JAR" | tee ci-artifacts/task02d-verify02/arc-core-jar.txt
        jar tf "$ARC_JAR" | tee ci-artifacts/task02d-verify02/arc-core-jar-contents.txt
        grep -Fxq 'arc/util/SharedLibraryLoader.class' ci-artifacts/task02d-verify02/arc-core-jar-contents.txt

    - name: Inspect runtimeClasspath and physical resolved artifacts
      shell: bash
      run: |
        set -euo pipefail
        ./gradlew -PandroidJvm :desktop:dependencies --configuration runtimeClasspath --console=plain |
          tee ci-artifacts/task02d-verify02/runtimeClasspath-dependencies.txt
        grep -Fq 'com.github.Anuken:arc-core:8eb00ffff0 -> project :Arc:arc-core'           ci-artifacts/task02d-verify02/runtimeClasspath-dependencies.txt

        ./gradlew -PandroidJvm :desktop:dependencyInsight           --configuration runtimeClasspath           --dependency com.github.Anuken:arc-core           --console=plain |
          tee ci-artifacts/task02d-verify02/arc-core-dependency-insight.txt

        cat > ci-artifacts/task02d-verify02/runtimeClasspath.init.gradle <<'EOF'
allprojects {
    afterEvaluate { p ->
        if (p.path == ':desktop') {
            p.tasks.register('task02dVerifyRuntimeClasspath') {
                doLast {
                    p.configurations.runtimeClasspath.resolve().sort { a, b -> a.absolutePath <=> b.absolutePath }.each {
                        println "RUNTIME_FILE=${it.absolutePath}"
                    }
                }
            }
        }
    }
}
EOF

        ./gradlew -PandroidJvm           --init-script ci-artifacts/task02d-verify02/runtimeClasspath.init.gradle           :desktop:task02dVerifyRuntimeClasspath           --console=plain |
          tee ci-artifacts/task02d-verify02/runtimeClasspath-files.txt

        ARC_RUNTIME_FILE="$(grep 'RUNTIME_FILE=' ci-artifacts/task02d-verify02/runtimeClasspath-files.txt |
          grep '/Arc/arc-core/build/libs/' | head -n1 | sed 's/^RUNTIME_FILE=//')"
        test -n "$ARC_RUNTIME_FILE"
        test -f "$ARC_RUNTIME_FILE"
        jar tf "$ARC_RUNTIME_FILE" | grep -Fxq 'arc/util/SharedLibraryLoader.class'
        echo "Resolved physical Arc artifact: $ARC_RUNTIME_FILE"

    - name: Build and inspect Android-JVM Mindustry JAR
      shell: bash
      run: |
        set -euo pipefail
        ./gradlew -PandroidJvm desktop:dist --rerun-tasks --stacktrace --console=plain
        test -f desktop/build/libs/Mindustry.jar

        jar tf desktop/build/libs/Mindustry.jar |
          tee ci-artifacts/task02d-verify02/Mindustry-jar-contents.txt
        grep -Fxq 'arc/util/SharedLibraryLoader.class' ci-artifacts/task02d-verify02/Mindustry-jar-contents.txt
        grep -Fxq 'arm64-v8a/libarc.so' ci-artifacts/task02d-verify02/Mindustry-jar-contents.txt

        cp desktop/build/libs/Mindustry.jar ci-artifacts/task02d-verify02/Mindustry-android-jvm.jar
        sha256sum desktop/build/libs/Mindustry.jar |
          tee ci-artifacts/task02d-verify02/Mindustry-android-jvm.jar.sha256

        javap -classpath desktop/build/libs/Mindustry.jar -c -p arc.util.SharedLibraryLoader |
          tee ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt >/dev/null
        grep -Fq 'isAndroidRuntime' ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt
        grep -Fq 'androidResourcePath' ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt
        grep -Fq 'System.load' ci-artifacts/task02d-verify02/packaged-shared-library-loader.javap.txt

    - name: Inspect packaged Android ARM64 Arc native artifact
      shell: bash
      run: |
        set -euo pipefail
        unzip -p desktop/build/libs/Mindustry.jar arm64-v8a/libarc.so > ci-artifacts/task02d-verify02/libarc.so
        test -s ci-artifacts/task02d-verify02/libarc.so

        READELF="$(command -v llvm-readelf || command -v readelf || true)"
        test -n "$READELF"
        "$READELF" -h ci-artifacts/task02d-verify02/libarc.so |
          tee ci-artifacts/task02d-verify02/libarc-readelf-header.txt
        "$READELF" -d ci-artifacts/task02d-verify02/libarc.so |
          tee ci-artifacts/task02d-verify02/libarc-readelf-dynamic.txt

        CLASS="$($READELF -h ci-artifacts/task02d-verify02/libarc.so | awk -F: '/Class:/{gsub(/^ +/,"",$2); print $2}')"
        MACHINE="$($READELF -h ci-artifacts/task02d-verify02/libarc.so | awk -F: '/Machine:/{gsub(/^ +/,"",$2); print $2}')"
        test "$CLASS" = "ELF64"
        printf '%s' "$MACHINE" | grep -q 'AArch64'

        "$READELF" -d ci-artifacts/task02d-verify02/libarc.so |
          sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p' | head -n1 |
          tee ci-artifacts/task02d-verify02/soname.txt
        "$READELF" -d ci-artifacts/task02d-verify02/libarc.so |
          sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' |
          tee ci-artifacts/task02d-verify02/dt-needed.txt

        for forbidden in libpthread.so.0 libdl.so.2 libm.so.6 libc.so.6 libstdc++.so.6 libgcc_s.so.1 ld-linux-aarch64.so.1 libGL.so.1 libSDL2-2.0.so.0; do
          ! grep -Fxq "$forbidden" ci-artifacts/task02d-verify02/dt-needed.txt || {
            echo "::error::Forbidden dependency present: $forbidden"
            exit 1
          }
        done

    - name: Run established TASK-02C packaging verifier
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/android-jvm/task-02c-verify-packaging.sh           ci-artifacts/task02d-verify02/Mindustry-android-jvm.jar

    - name: Desktop regression build
      shell: bash
      run: |
        set -euo pipefail
        ./gradlew desktop:dist --rerun-tasks --stacktrace --console=plain
        test -f desktop/build/libs/Mindustry.jar
        echo "Desktop regression: PASS"

    - name: Upload TASK-02D verification artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: TASK-02D-VERIFY-02-packaging-${{ github.sha }}
        path: ci-artifacts/task02d-verify02
        if-no-files-found: error

