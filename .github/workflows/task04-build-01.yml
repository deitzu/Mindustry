name: TASK-04-BUILD-01 Module Boundary Verification

on:
  push:
    branches:
      - android-jvm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: AndroidJvmLauncher module boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install Android native toolchain
        shell: bash
        env:
          ANDROID_NDK_VERSION: '30.0.16248370'
          ANDROID_API_LEVEL: '36'
          ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
          ANDROID_CMAKE_VERSION: '3.31.6'
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager --sdk_root="$sdk_root" --install             "platforms;android-${ANDROID_API_LEVEL}"             "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"             "ndk;${ANDROID_NDK_VERSION}"             "cmake;${ANDROID_CMAKE_VERSION}"
          ndk_dir="$sdk_root/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_dir" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "$ndk_dir" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Clone exact pinned Arc
        shell: bash
        run: |
          set -euo pipefail
          expected='8eb00ffff0126d0576c67df46f99b8f6bccd96fe'
          git clone --no-checkout --filter=blob:none --depth=1 https://github.com/Anuken/Arc ../Arc
          git -C ../Arc fetch --no-tags --depth=1 origin "$expected"
          git -C ../Arc checkout --detach "$expected"
          actual="$(git -C ../Arc rev-parse HEAD)"
          [ "$actual" = "$expected" ]
          echo "Arc=$actual"

      - name: Apply existing Arc loader overlay
        run: |
          set -euo pipefail
          git -C ../Arc apply --check "$GITHUB_WORKSPACE/ci/android-jvm/task02d-arc-shared-library-loader.patch"
          git -C ../Arc apply "$GITHUB_WORKSPACE/ci/android-jvm/task02d-arc-shared-library-loader.patch"
          git -C ../Arc diff --check

      - name: Verify source module boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -f core/src/mindustry/androidjvm/AndroidJvmLauncher.java
          test -f desktop/src/mindustry/androidjvm/AndroidJvmLauncher.java
          grep -Fxq 'package mindustry.androidjvm;' desktop/src/mindustry/androidjvm/AndroidJvmLauncher.java
          if grep -A25 '^project(":core")' build.gradle | grep -q 'backend-sdl'; then
            echo "::error::backend-sdl dependency was added to core"
            exit 1
          fi
          grep -A25 '^project(":desktop")' build.gradle | grep -q 'backend-sdl'

      - name: Compile core
        run: ./gradlew :core:compileJava --stacktrace --console=plain

      - name: Compile desktop
        run: ./gradlew :desktop:compileJava --stacktrace --console=plain

      - name: Build Android-JVM JAR
        run: ./gradlew -PandroidJvm desktop:dist --rerun-tasks --stacktrace --console=plain

      - name: Verify Android-JVM JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="desktop/build/libs/Mindustry.jar"
          test -f "$jar_file"
          echo "== Android-JVM manifest =="
          unzip -p "$jar_file" META-INF/MANIFEST.MF
          unzip -p "$jar_file" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fxq 'Main-Class: mindustry.androidjvm.AndroidJvmLauncher'
          jar tf "$jar_file" | grep -Fxq 'mindustry/androidjvm/AndroidJvmLauncher.class'
          echo "Android-JVM JAR Main-Class and launcher class: PASS"

      - name: Build normal desktop JAR
        run: ./gradlew desktop:dist --rerun-tasks --stacktrace --console=plain

      - name: Verify normal desktop JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="desktop/build/libs/Mindustry.jar"
          test -f "$jar_file"
          echo "== Desktop manifest =="
          unzip -p "$jar_file" META-INF/MANIFEST.MF
          unzip -p "$jar_file" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fxq 'Main-Class: mindustry.desktop.DesktopLauncher'
          jar tf "$jar_file" | grep -Fxq 'mindustry/desktop/DesktopLauncher.class'
          echo "Desktop JAR Main-Class and launcher class: PASS"
