if(JavaVersion.current().ordinal() < JavaVersion.VERSION_17.ordinal()){
    throw new Exception("!!! YOU MUST USE JAVA 17 OR ABOVE TO COMPILE AND RUN MINDUSTRY !!! Read the README. Your version: ${System.properties["java.version"]}")
}

include 'desktop', 'core', 'server', 'ios', 'annotations', 'tools', 'tests'

def hasSdk = System.getenv("ANDROID_HOME") != null

def localProperties = new Properties()
if(new File(settingsDir, 'local.properties').exists()){
    localProperties.load(new File(settingsDir, 'local.properties').newDataInputStream())
	if(localProperties.containsKey("sdk.dir")) hasSdk = true
}

if(System.getenv("JITPACK") == "true") hasSdk = false

if(hasSdk){
    include 'android'
}else{
    println("No Android SDK found. Skipping Android module.")
}

if(hasProperty("localRhino") || localProperties.getOrDefault("localRhino", "false") == "true"){
    includeBuild("../rhino")
}

if(hasProperty("localSteamworks") || localProperties.getOrDefault("localSteamworks", "false") == "true"){
    includeBuild("../steamworks4j")
}


/*
 * TASK-02D VERIFY-02 TEMPORARY CI DIAGNOSTIC.
 * Pins and applies the deterministic Arc loader patch for CI only.
 * Remove this block after verification.
 */
if(hasProperty("androidJvm") && new File(settingsDir.parentFile, "Arc/.git").exists()){
    def task02dExpectedArcSha = "8eb00ffff0126d0576c67df46f99b8f6bccd96fe"
    def task02dArcDir = new File(settingsDir.parentFile, "Arc")
    def task02dPatch = new File(settingsDir, "ci/android-jvm/task02d-arc-shared-library-loader.patch")

    def task02dRun = { List<String> command ->
        def process = new ProcessBuilder(command)
            .directory(settingsDir)
            .redirectErrorStream(true)
            .start()
        def output = process.inputStream.text
        def exitCode = process.waitFor()
        println "TASK-02D VERIFY-02 CMD: " + command.join(" ")
        if(!output.isEmpty()) println output.trim()
        if(exitCode != 0){
            throw new GradleException("TASK-02D VERIFY-02 command failed ($exitCode): " + command.join(" "))
        }
        return output.trim()
    }

    def task02dArcSha = task02dRun(["git", "-C", task02dArcDir.absolutePath, "rev-parse", "HEAD"])
    if(task02dArcSha != task02dExpectedArcSha){
        task02dRun(["git", "-C", task02dArcDir.absolutePath, "fetch", "--no-tags", "--depth=1", "origin", task02dExpectedArcSha])
        task02dRun(["git", "-C", task02dArcDir.absolutePath, "checkout", "--detach", task02dExpectedArcSha])
        task02dArcSha = task02dRun(["git", "-C", task02dArcDir.absolutePath, "rev-parse", "HEAD"])
    }

    if(task02dArcSha != task02dExpectedArcSha){
        throw new GradleException("TASK-02D VERIFY-02 Arc SHA mismatch: " + task02dArcSha)
    }

    if(!task02dPatch.isFile()){
        throw new GradleException("TASK-02D VERIFY-02 patch file missing: " + task02dPatch)
    }

    def task02dChanged = task02dRun(["git", "-C", task02dArcDir.absolutePath, "diff", "--name-only"])
    if(!task02dChanged.readLines().contains("arc-core/src/arc/util/SharedLibraryLoader.java")){
        task02dRun(["git", "-C", task02dArcDir.absolutePath, "apply", "--check", task02dPatch.absolutePath])
        task02dRun(["git", "-C", task02dArcDir.absolutePath, "apply", task02dPatch.absolutePath])
        task02dRun(["git", "-C", task02dArcDir.absolutePath, "diff", "--check"])
    }

    println "TASK-02D VERIFY-02 Arc checkout/patched overlay ready: " + task02dRun(["git", "-C", task02dArcDir.absolutePath, "rev-parse", "HEAD"])
}

if(!hasProperty("noLocalArc")){
    if(new File(rootDir.parent, 'Arc').exists()){
        println("Compiling with localArc")
        includeBuild("../Arc")
    }else{
        println("Local Arc not found. Cloning https://github.com/Anuken/Arc to a directory next to Mindustry is highly recommended, as jitpack is unreliable.")
    }

    if(new File(rootDir.parent, 'Mindustry-Debug').exists()){
        include(":debug")
        project(":debug").projectDir = new File(rootDir.parent, "Mindustry-Debug")
    }
}else{
    println("Not including local repositories.")
}