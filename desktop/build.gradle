sourceSets.main.java.srcDirs = ["src/"]

project.ext.mainClassName = project.hasProperty("androidJvm") ? "mindustry.androidjvm.AndroidJvmLauncher" : "mindustry.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets")

def JDK_DIR = "$System.env.JDK_DIR"
def ICON_DIR = new File("$rootDir/core/assets/icons/icon.icns")
def platforms = ["Linux64", "Windows64", "MacOS"]

tasks.register('run', JavaExec){
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    if(System.getProperty("os.name").toLowerCase().contains("mac")){
        jvmArgs("-XstartOnFirstThread")
    }

    jvmArgs += "-XX:+ShowCodeDetailsInExceptionMessages"

    if(project.hasProperty("args")){
        args Eval.me(project.getProperties()["args"])
    }

    if(project.hasProperty("jvmArgs")){
        jvmArgs((List<String>) Eval.me(project.getProperties()["jvmArgs"]))
    }

    if(project.hasProperty("dataDir")){
        environment("MINDUSTRY_DATA_DIR", project.getProperties()["dataDir"])
    }

    if(args.contains("debug")){
        mainClass = "mindustry.debug.DebugLauncher"
    }
}

def androidSdlJavaGlueTask = null
def androidSdlJavaOutput = null
def androidSdlGlueClasses = []

if(project.hasProperty("androidJvm")){
    def androidSdlRoot = new File(rootDir.parent, "SDL2-2.32.8")
    def androidSdlJavaRoot = new File(androidSdlRoot, "android-project/app/src/main/java")
    androidSdlJavaOutput = file("$buildDir/generated/android-jvm/sdl-java-glue/classes")
    def androidSdkRoot = System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME")
    def androidApiLevel = System.getenv("ANDROID_API_LEVEL") ?: "36"
    def androidJar = androidSdkRoot == null ? null : new File(androidSdkRoot, "platforms/android-$androidApiLevel/android.jar")

    def androidSdlGlueSources = [
        "org/libsdl/app/SDLActivity.java",
        "org/libsdl/app/SDLAudioManager.java",
        "org/libsdl/app/SDLControllerManager.java"
    ]
    androidSdlGlueClasses = [
        "org/libsdl/app/SDLActivity.class",
        "org/libsdl/app/SDLInputConnection.class",
        "org/libsdl/app/SDLAudioManager.class",
        "org/libsdl/app/SDLControllerManager.class",
        "org/libsdl/app/SDLJoystickHandler.class",
        "org/libsdl/app/SDLJoystickHandler_API16.class",
        "org/libsdl/app/SDLJoystickHandler_API19.class",
        "org/libsdl/app/SDLHapticHandler.class",
        "org/libsdl/app/SDLHapticHandler_API26.class"
    ]

    androidSdlJavaGlueTask = tasks.register("compileAndroidJvmSdlJavaGlue", JavaCompile){
        source androidSdlGlueSources.collect{ new File(androidSdlJavaRoot, it) }
        destinationDirectory.set(androidSdlJavaOutput)
        classpath = files(androidJar)
        sourceCompatibility = "8"
        targetCompatibility = "8"
        options.encoding = "UTF-8"
        options.compilerArgs += ["-proc:none", "-sourcepath", androidSdlJavaRoot.absolutePath]

        doFirst{
            if(!androidSdlRoot.isDirectory()){
                throw new GradleException("SDL source checkout is missing: " + androidSdlRoot)
            }
            if(androidSdkRoot == null || !androidJar.isFile()){
                throw new GradleException("Android API " + androidApiLevel + " android.jar is missing; set ANDROID_SDK_ROOT or ANDROID_HOME")
            }

            def sdlVersionHeader = new File(androidSdlRoot, "include/SDL_version.h")
            if(!sdlVersionHeader.isFile()){
                throw new GradleException("SDL version header is missing: " + sdlVersionHeader)
            }
            def sdlVersionText = sdlVersionHeader.text
            def sdlMajorMatch = (sdlVersionText =~ /(?m)^#define SDL_MAJOR_VERSION\\s+(\\d+)/)
            def sdlMinorMatch = (sdlVersionText =~ /(?m)^#define SDL_MINOR_VERSION\\s+(\\d+)/)
            def sdlPatchMatch = (sdlVersionText =~ /(?m)^#define SDL_PATCHLEVEL\\s+(\\d+)/)
            if(!sdlMajorMatch.find() || !sdlMinorMatch.find() || !sdlPatchMatch.find()){
                throw new GradleException("SDL version macros are missing from: " + sdlVersionHeader)
            }
            def sdlVersion = sdlMajorMatch.group(1) + "." + sdlMinorMatch.group(1) + "." + sdlPatchMatch.group(1)
            if(sdlVersion != "2.32.8"){
                throw new GradleException("Unexpected SDL version: expected 2.32.8, got " + sdlVersion)
            }

            androidSdlGlueSources.each{ sourcePath ->
                File sourceFile = new File(androidSdlJavaRoot, sourcePath)
                if(!sourceFile.isFile()){
                    throw new GradleException("Required SDL Android Java source is missing: " + sourceFile)
                }
            }
        }
    }
}

tasks.register('dist', Jar){
    dependsOn configurations.runtimeClasspath
    dependsOn ":desktop:processResources"

    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)

    def runtimeClasspathContents = {
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from{
        runtimeClasspathContents()
    }

    from files(project.assetsDir)
    exclude("config/**")
    exclude("**hs_err**.log")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    if(androidSdlJavaGlueTask != null){
        dependsOn androidSdlJavaGlueTask
        from(androidSdlJavaOutput){
            androidSdlGlueClasses.each{ include it }
        }

        exclude("armeabi-v7a/libarc.so", "x86/libarc.so", "x86_64/libarc.so")

        def androidSdlNativeJar = new File(rootDir.parent, "Arc/backends/backend-sdl/libs/sdl-arc-natives-arm64-v8a.jar")
        doFirst{
            if(!androidSdlNativeJar.isFile()){
                throw new GradleException("Android-JVM SDL native package is missing: " + androidSdlNativeJar)
            }

            def entries = zipTree(androidSdlNativeJar).matching{ include "libsdl-arc.so" }.files
            if(entries.size() != 1){
                throw new GradleException("Android-JVM SDL native package does not contain exactly one libsdl-arc.so: " + androidSdlNativeJar)
            }
        }

        into("arm64-v8a"){
            from{
                zipTree(androidSdlNativeJar).matching{ include "libsdl-arc.so" }
            }
        }
    }

    //don't include steam shared libraries unless necessary
    if(!versionModifier.contains("steam")){
        exclude("**steam**.so", "**steam**.dll", "**steam**.dylib")
    }

    archiveFileName = "${appName}.jar"

    manifest{
        attributes 'Main-Class': project.mainClassName
        //note: this doesn't do anything when launched from the bundled JVM
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
        attributes 'Multi-Release': 'true'
    }
}


if(!project.ext.hasSprites() && System.getenv("JITPACK") != "true"){
    println "Scheduling sprite packing."
    run.dependsOn ":tools:pack"
    dist.dependsOn ":tools:pack"
}

//this is only for local testing
//add -Prelease -PversionModifier=steam as build properties
tasks.register('steamtest'){
    dependsOn dist
    doLast{
        copy{
            from "build/libs/Mindustry.jar"
            if(project.hasProperty("destination")){
                into project.property("destination")
            }else if(System.properties["os.name"].contains("Mac")){
                into "/Users/anuke/Library/Application Support/Steam/steamapps/common/Mindustry/Mindustry.app/Contents/Resources"
            }else{
                into "/home/anuke/.steam/steam/steamapps/common/Mindustry/jre"
            }
            rename("Mindustry.jar", "desktop.jar")
        }
    }
}

//required templates:
//- Windows32: Not provided by Packr! This uses Java 8
//required JDKs:
//- Windows64
//- Linux64
//- Mac
platforms.each{ platform ->
    task "packr${platform.toString()}"{
        dependsOn dist

        doLast{
            copy{
                into "build/packr/"
                rename("${appName}.jar", "desktop.jar")
                from "build/libs/${appName}.jar"
            }

            delete{
                delete "build/packr/output/"
            }

            def jarPath = JDK_DIR + "packr.jar"
            def args = new String[]{"java", "-jar", jarPath}

            args += new String[]{
                "--platform", platform == "MacOS" ? "Mac" : platform.toString(),
                "--jdk", JDK_DIR + "jre-${platform.toString().toLowerCase()}",
                "--executable", appName,
                "--classpath", "$rootDir/desktop/build/packr/desktop.jar".toString(),
                "--mainclass", project.ext.mainClassName,
                "--verbose",
                "--bundle", getPackage() + ".mac",
                "--icon", ICON_DIR,
                "--output", "$rootDir/desktop/build/packr/output".toString(),
                "--removelibs", "$rootDir/desktop/build/packr/desktop.jar".toString()
            }

            args += "--vmargs"

            if(platform == "MacOS"){
                args += "XstartOnFirstThread"
            }

            args += "Dhttps.protocols=TLSv1.2,TLSv1.1,TLSv1"
            args += "XX:+ShowCodeDetailsInExceptionMessages"
            args += "XX:+UseCompactObjectHeaders"
            args += "enable-native-access=ALL-UNNAMED"

            project.services.get(ExecOperations).exec{
                commandLine args.toList()
                standardOutput = System.out
            }

            def outputJsonFile = platform != "MacOS" ? file("build/packr/output/Mindustry.json") : file("build/packr/output/${appName}.app/Contents/Resources/Mindustry.json")

            if(platform != "MacOS"){
                copy{
                    into "build/packr/output/jre/"
                    from "build/packr/output/desktop.jar"
                }

                delete{
                    delete "build/packr/output/desktop.jar"
                }

                outputJsonFile.text = outputJsonFile.text.replace("desktop.jar", "jre/desktop.jar")
            }else{
                copy{
                    into "build/packr/output/${appName}.app/Contents/"
                    from "build/packr/output/Contents/"
                }

                delete{
                    delete "build/packr/output/Contents/"
                }
            }

            //packr is broken and won't let me add one hyphen, so I have to do that myself later
            outputJsonFile.text = outputJsonFile.text.replace("-enable-native-access=ALL-UNNAMED", "--enable-native-access=ALL-UNNAMED")

            if((platform == "Windows64")){
                copy{
                    from "build/packr/output/jre/bin/msvcr100.dll"
                    into "build/packr/output/"
                    rename("msvcr100.dll", "MSVCR100.dll")
                }
            }

            if(versionModifier.contains("steam")){
                copy{
                    def lib = platform == "MacOS" || platform == "Linux64" ? "lib" : ""
                    from zipTree(platform == "MacOS" ? "build/packr/output/${appName}.app/Contents/Resources/desktop.jar" : "build/packr/output/jre/desktop.jar").matching{
                        include "${lib}frogworks${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                        include "${lib}steam_api${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                    }
                    into platform != "MacOS" ? "build/packr/output/" : "build/packr/output/${appName}.app/Contents/Resources"
                }
            }

            copy{
                from "build/packr/output"
                into "../deploy/${platform.toString()}"
            }
        }

        task "zip${platform.toString()}"(type: Zip){
            from "build/packr/output"
            archiveFileName = "${generateDeployName(platform.toString())}.zip"
            destinationDirectory = (file("../deploy"))

            doLast{
                delete{
                    delete "build/packr/"
                }
            }
        }

        finalizedBy "zip${platform.toString()}"

    }
}
